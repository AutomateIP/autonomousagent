[project]
name = "autonomous-agent"
version = "0.1.0"
description = "Autonomous agent framework with universal MCP support"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.45",
    "langchain>=0.3.7",
    "litellm>=1.80.11",
    "fastmcp>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
agent = "src.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
